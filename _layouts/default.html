<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>{{ page.title }} | {{ site.title }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ '/css/blog.css' | relative_url }}">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>

    {% seo %}
  </head>
  <body>
    <nav class="navbar navbar-expand-md navbar-dark fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <a class="nav-link ms-auto" href="/">&#x2190; Back to Main Site</a>
      </div>
    </nav>
    <div class="container">
      {{ content }}
    </div>
    <footer class="site-footer">
      <div class="container">
        <p class="footer-text">
          &copy; {{ 'now' | date: "%Y" }} {{ site.author | default: site.title }}
        </p>
        <p class="footer-built">
          Built with <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> and <a href="https://claude.ai" target="_blank">Claude</a>
        </p>
      </div>
    </footer>
    <script src="{{ '/js/blog.js' | relative_url }}"></script>
  </body>
</html>
