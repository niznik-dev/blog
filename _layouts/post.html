---
layout: default
---

<div class="row">
  <div class="col-xl-9 content post-content">
    <h1>{{ page.title }}</h1>
    <p class="post-date">{{ page.date | date: "%B %-d, %Y" }}</p>
    <hr>
    {{ content }}
    {% if page.tags.size > 0 %}
    <hr>
    <div class="post-tags">
      {% for tag in page.tags %}
      <span class="post-tag">{% if site.data.tags[tag] %}{{ site.data.tags[tag] }} {% endif %}{{ tag }}</span>
      {% endfor %}
    </div>
    {% endif %}
  </div>
</div>
