---
layout: default
title: Posts
---

<div class="row">
  <div class="col-xl-9 content post-content">
    <h1>{{ site.title }}</h1>
    <p>{{ site.description }}</p>
    <hr>
    <ul class="post-list">
      {% for post in site.posts %}
      <li>
        <span class="post-date">{{ post.date | date: "%B %-d, %Y" }}</span>
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      </li>
      {% endfor %}
    </ul>
  </div>
</div>
